name: Deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  # Pre-deployment checks
  pre-deploy:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    outputs:
      should_deploy: ${{ steps.check.outputs.deploy }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for deploy-triggering changes
        id: check
        run: |
          # Skip deploy if only README or docs changed
          CHANGED_FILES=$(git diff --name-only HEAD~1 2>/dev/null || echo "")
          DEPLOY_NEEDED=true

          if echo "$CHANGED_FILES" | grep -qE "^README\.md$|^\.github/.*\.md$"; then
            if [ $(echo "$CHANGED_FILES" | wc -l) -eq 1 ]; then
              DEPLOY_NEEDED=false
            fi
          fi

          echo "deploy=$DEPLOY_NEEDED" >> $GITHUB_OUTPUT
          echo "Changed files: $CHANGED_FILES"
          echo "Deploy needed: $DEPLOY_NEEDED"

      - name: Run security audit
        run: |
          echo "## 🔒 Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Checking for known vulnerabilities..." >> $GITHUB_STEP_SUMMARY

  # Deploy to staging first
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: pre-deploy
    if: needs.pre-deploy.outputs.should_deploy == 'true'
    environment:
      name: staging
      url: https://rhosam-hotel-staging.onrender.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.STAGING_API_URL }}

      - name: Run tests
        working-directory: backend
        run: npm test
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          NODE_ENV: test

      - name: Deployment summary
        run: |
          echo "## 🚀 Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Deployed to staging" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://rhosam-hotel-staging.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Test all features on staging" >> $GITHUB_STEP_SUMMARY
          echo "2. Approve production deployment" >> $GITHUB_STEP_SUMMARY

  # Deploy to production (requires approval)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://rhosam-hotel-frontend.onrender.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for production
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.API_URL }}

      - name: Run database migrations
        working-directory: backend
        run: node src/run-migrations.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deployment summary
        run: |
          echo "## 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Deployed to production" >> $GITHUB_STEP_SUMMARY
          echo "**API:** https://rhosam-hotel-api.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend:** https://rhosam-hotel-frontend.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment Variables" >> $GITHUB_STEP_SUMMARY
          echo "Configure in Render Dashboard:" >> $GITHUB_STEP_SUMMARY
          echo "- \`DATABASE_URL\` — PostgreSQL connection" >> $GITHUB_STEP_SUMMARY
          echo "- \`JWT_SECRET\` — Production secret" >> $GITHUB_STEP_SUMMARY
          echo "- \`PAYMENT_GATEWAY\` — PAYSTACK/FLUTTERWAVE" >> $GITHUB_STEP_SUMMARY
          echo "- \`PAYSTACK_SECRET_KEY\` — Paystack secret" >> $GITHUB_STEP_SUMMARY

      - name: Verify deployment
        run: |
          echo "## ✅ Deployment Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Checking health endpoint..." >> $GITHUB_STEP_SUMMARY
          # Wait for deployment to be ready
          sleep 30
          # Health check will be verified by Render automatically

  # Post-deployment notifications
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: deploy-production
    if: always()

    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.deploy-production.result }}" = "success" ]; then
            echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Production is live at https://rhosam-hotel-frontend.onrender.com" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the logs for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
